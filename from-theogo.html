<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JustGo — Share from TheoGo</title>
<link rel="icon" href="https://justgo.42web.io/icon-512.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
 /* =========================================================
   JustGo — from-theogo bridge page
   Matches the main JustGo app design language
   ========================================================= */
:root {
    --brand:      #144097;
    --brand-hover:#10367f;
    --brand-press:#0c2b6b;
    --brand-soft: #eef3fc;
    --brand-border:#d5e0f5;

    --text:       #172033;
    --text-2:     #47536b;
    --text-3:     #7d8796;
    --text-4:     #9aa2ae;

    --bg:         #f4f6fa;
    --surface:    #ffffff;
    --surface-2:  #f7f8fa;
    --surface-3:  #eef3fc;

    --border:     #e4e8ef;
    --border-2:   #d8dee7;
    --border-soft:#edf0f4;

    --green:      #10b981;
    --green-dark: #047857;
    --blue:       #2563eb;
    --blue-dark:  #144097;
    --purple:     #7c3aed;
    --purple-dark:#4c1d95;

    --danger:     #dc2626;
    --danger-soft:#fef2f2;
    --success:    #16a34a;
    --success-soft:#f0fdf4;

    --radius-sm: 8px;
    --radius:    10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
    --radius-pill: 999px;

    --shadow-sm: 0 2px 6px rgba(20, 35, 60, 0.05);
    --shadow:    0 6px 24px rgba(20, 35, 60, 0.06);
    --shadow-lg: 0 12px 40px rgba(20, 35, 60, 0.10);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
    padding: 28px 16px 64px;
}

/* --------- Card --------- */
.card {
    width: 100%;
    max-width: 540px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 26px 24px 24px;
    box-shadow: var(--shadow-lg);
}

/* --------- Brand header --------- */
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
.brand-logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.4px;
    box-shadow: 0 3px 8px rgba(20, 64, 151, 0.24);
    overflow: hidden;
    flex-shrink: 0;
}
.brand-text strong {
    display: block;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: var(--text);
}
.brand-text span {
    display: block;
    font-size: 12px;
    color: var(--text-3);
}

/* --------- Headings --------- */
h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
}
.sub {
    margin: 0 0 18px;
    font-size: 13.5px;
    color: var(--text-3);
    line-height: 1.55;
}

/* --------- Preview (article card) --------- */
.preview {
    padding: 12px 14px;
    background: var(--brand-soft);
    border-left: 4px solid var(--brand);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 18px;
    max-height: 180px;
    overflow-y: auto;
}
.preview strong {
    display: block;
    color: var(--text);
    font-weight: 700;
    margin-bottom: 3px;
}
.preview .src {
    color: var(--text-3);
    font-size: 12px;
}
.preview a {
    color: var(--brand);
    font-weight: 600;
    text-decoration: none;
    word-break: break-all;
}
.preview a:hover { text-decoration: underline; }

/* --------- Form fields --------- */
.field { margin-bottom: 12px; }
.field label {
    display: block;
    margin-bottom: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: #354052;
}
.field input,
.field textarea {
    width: 100%;
    height: 44px;
    padding: 0 13px;
    border: 1px solid var(--border-2);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color .12s, box-shadow .12s, background .12s;
    -webkit-appearance: none;
    appearance: none;
}
.field input::placeholder,
.field textarea::placeholder { color: var(--text-4); }
.field input:focus,
.field textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(20, 64, 151, 0.09);
    background: #fff;
}
.field textarea {
    height: auto;
    padding: 11px 13px;
    min-height: 120px;
    resize: vertical;
    line-height: 1.55;
    font-size: 14px;
}

/* --------- Buttons --------- */
.btn {
    width: 100%;
    height: 44px;
    padding: 0 18px;
    border-radius: 10px;
    border: 1px solid var(--border-2);
    background: var(--surface);
    color: var(--text-2);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .12s, border-color .12s, transform .12s, box-shadow .12s, filter .12s;
}
.btn:hover:not(:disabled) {
    border-color: var(--brand);
    color: var(--brand);
    background: #fbfcff;
    box-shadow: 0 4px 14px rgba(20, 64, 151, 0.08);
    transform: translateY(-1px);
}
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

/* Primary navy */
.btn.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    box-shadow: 0 2px 6px rgba(20, 64, 151, 0.20);
}
.btn.primary:hover:not(:disabled) {
    background: var(--brand-hover);
    border-color: var(--brand-hover);
    color: #fff;
    box-shadow: 0 6px 18px rgba(20, 64, 151, 0.24);
}

/* Notes (emerald) */
.btn.notes {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 2px 6px rgba(16, 185, 129, 0.22);
}
.btn.notes:hover:not(:disabled) {
    color: #fff;
    filter: brightness(1.05);
    box-shadow: 0 6px 18px rgba(16, 185, 129, 0.28);
}

/* Chat (blue) */
.btn.chat {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.22);
}
.btn.chat:hover:not(:disabled) {
    color: #fff;
    filter: brightness(1.05);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
}

/* Ghost */
.btn.ghost {
    background: transparent;
    border-color: var(--border-2);
    color: var(--text-2);
}

/* --------- Message blocks --------- */
.msg {
    margin-top: 12px;
    padding: 10px 13px;
    border-radius: 9px;
    font-size: 12.5px;
    background: var(--surface-2);
    color: var(--text-2);
    border-left: 3px solid var(--brand);
    line-height: 1.5;
    display: none;
    word-break: break-word;
}
.msg.show { display: block; }
.msg.ok {
    background: var(--success-soft);
    color: #166534;
    border-left-color: var(--success);
}
.msg.err {
    background: var(--danger-soft);
    color: #991b1b;
    border-left-color: var(--danger);
}

/* --------- User chip --------- */
.user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 13px;
}
.user-chip .av {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
}
.user-chip .uinfo { flex: 1; min-width: 0; }
.user-chip .uinfo strong {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.user-chip .uinfo span {
    display: block;
    font-size: 11.5px;
    color: var(--text-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.user-chip .switch {
    border: 0;
    background: transparent;
    color: var(--brand);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background .12s;
}
.user-chip .switch:hover { background: rgba(20, 64, 151, 0.08); }

/* --------- Footer --------- */
.foot {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--border-soft);
    text-align: center;
    font-size: 12.5px;
    color: var(--text-3);
    line-height: 1.55;
}
.foot a {
    color: var(--brand);
    font-weight: 600;
    text-decoration: none;
}
.foot a:hover { text-decoration: underline; }

/* --------- Tabs --------- */
.tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #f1f4f9;
    border-radius: 11px;
    margin-bottom: 16px;
}
.tab {
    flex: 1;
    padding: 10px 12px;
    border: 0;
    background: transparent;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    color: var(--text-3);
    cursor: pointer;
    transition: background .12s, color .12s, box-shadow .12s;
}
.tab:hover { color: var(--text-2); }
.tab.active {
    background: #fff;
    color: var(--brand);
    box-shadow: 0 1px 3px rgba(20, 35, 60, 0.08);
}
.pane { display: none; }
.pane.active { display: block; animation: fadeIn .18s ease; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* --------- User search results --------- */
.user-results {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    margin-top: 6px;
    box-shadow: 0 4px 14px rgba(20, 35, 60, 0.04);
}
.user-results:empty { display: none; border: 0; box-shadow: none; }
.user-row {
    padding: 11px 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border-soft);
    transition: background .12s;
}
.user-row:last-child { border-bottom: 0; }
.user-row:hover { background: var(--brand-soft); }
.user-row .av {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    background-size: cover;
    background-position: center;
}
.user-row .info { min-width: 0; flex: 1; }
.user-row .info strong {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.user-row .info span {
    display: block;
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 1px;
}
.user-empty {
    padding: 16px;
    text-align: center;
    color: var(--text-3);
    font-size: 12.5px;
}

/* Selected user chip */
.selected-user {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    border-radius: 10px;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--brand);
}
.selected-user .rm {
    margin-left: auto;
    border: 0;
    background: rgba(20, 64, 151, 0.10);
    color: var(--brand);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background .12s;
}
.selected-user .rm:hover { background: rgba(20, 64, 151, 0.20); }

/* --------- Loading spinner --------- */
.spinner {
    display: inline-block;
    width: 30px;
    height: 30px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --------- Responsive --------- */
@media (max-width: 480px) {
    body { padding: 16px 12px 48px; }
    .card { padding: 22px 18px 20px; border-radius: 16px; }
    h1 { font-size: 18.5px; }
    .brand-logo { width: 38px; height: 38px; font-size: 15px; }
    .btn { height: 42px; font-size: 13.5px; }
    .field input { height: 42px; font-size: 14px; }
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-logo">JG</div>
    <div class="brand-text">
      <strong>JustGo</strong>
      <span>Share from TheoGo</span>
    </div>
  </div>

  <h1 id="headline">Loading…</h1>
  <p class="sub" id="subline">Please wait.</p>

  <div class="preview" id="preview" style="display:none;"></div>

  <div id="loading" style="text-align:center;padding:20px 0;">
    <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:var(--brand);border-radius:50%;animation:spin .9s linear infinite;"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>

  <div id="authStage" style="display:none;">
    <div class="field">
      <label>JustGo username</label>
      <input id="loginUser" type="text" placeholder="e.g. ashish" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Your password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="loginBtn">🔐 Sign in with JustGo</button>
    <div class="msg" id="authMsg"></div>
    <div class="foot">
      No account? <a href="https://justgo.42web.io/" target="_blank" rel="noopener">Create one on JustGo →</a>
    </div>
  </div>

  <div id="actionStage" style="display:none;">
    <div class="user-chip" id="userChip" style="display:none;"></div>

    <div class="tabs">
      <button class="tab active" data-pane="notes">📝 Add to Notes</button>
      <button class="tab" data-pane="chat">📤 Send to chat</button>
    </div>

    <!-- NOTES PANE -->
    <div class="pane active" id="pane-notes">
      <div class="field">
        <label>Note title</label>
        <input id="noteTitle" type="text" maxlength="140">
      </div>
      <div class="field">
        <label>Note content</label>
        <textarea id="noteBody"></textarea>
      </div>
      <div class="field">
        <label>Tags (comma separated)</label>
        <input id="noteTags" type="text" placeholder="theogo, science, homework">
      </div>
      <div class="field">
        <label>Source URL</label>
        <input id="noteSource" type="url">
      </div>
      <label style="display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text-2);font-weight:600;margin:4px 0 12px;">
        <input type="checkbox" id="notePublic" style="accent-color:var(--brand);"> Make this note public
      </label>
      <button class="btn notes" id="saveNoteBtn">💾 Save to JustGo Notes</button>
      <div class="msg" id="notesMsg"></div>
    </div>

    <!-- CHAT PANE -->
    <div class="pane" id="pane-chat">
      <div class="field">
        <label>Send to</label>
        <input id="chatSearch" type="text" placeholder="Search a classmate by username" autocomplete="off">
        <div class="user-results" id="chatResults"></div>
        <div id="chatSelected"></div>
      </div>
      <div class="field">
        <label>Add a note (optional)</label>
        <input id="chatNote" type="text" placeholder="Check this out">
      </div>
      <button class="btn chat" id="sendChatBtn" disabled>📤 Send</button>
      <div class="msg" id="chatMsg"></div>
    </div>
  </div>

  <div class="foot" id="footer" style="display:none;">
    <a href="https://justgo.42web.io/">← Back to JustGo</a>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://hvuhdnljbkdwzxlquvfp.supabase.co";
  var SUPABASE_KEY = "sb_publishable_csgdlWOp6QexF8SmH7oSfQ_XRnaIzuY";
  var db = null;
  var currentUser = null;
  var currentProfile = null;
  var payload = {};

  function $(id) { return document.getElementById(id); }
  function setMsg(el, text, kind) {
    el.className = "msg show" + (kind ? " " + kind : "");
    el.textContent = text;
  }
  function hideMsg(el) { el.className = "msg"; el.textContent = ""; }

  /* ---- Parse URL params ---- */
  function readParams() {
    var p = new URLSearchParams(window.location.search);
    payload = {
      title: p.get("title") || "",
      url:   p.get("url") || "",
      source: p.get("source") || "",
      body:  p.get("body") || "",
      tags:  p.get("tags") || "",
      action: p.get("action") || "notes", // notes | chat | both
      from:  p.get("from") || "theogo"
    };
  }

  function buildDefaultBody() {
    var lines = [];
    if (payload.source) lines.push("Source: " + payload.source);
    if (payload.from) lines.push("From: " + payload.from);
    if (payload.url) lines.push("", "Link: " + payload.url);
    return lines.join("\n").trim();
  }

  function buildDefaultTags() {
    var tags = [];
    if (payload.from) tags.push(payload.from);
    if (payload.tags) {
      payload.tags.split(",").forEach(function (t) {
        t = t.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-");
        if (t && tags.indexOf(t) === -1) tags.push(t);
      });
    }
    return tags.join(", ");
  }

  /* ---- Render ---- */
  function renderPreview() {
    var pv = $("preview");
    if (!payload.title && !payload.url) { pv.style.display = "none"; return; }
    pv.style.display = "";
    pv.innerHTML = '<strong>' + escapeHtml(payload.title || "Untitled") + '</strong>' +
      (payload.source ? '<br>' + escapeHtml(payload.source) : "") +
      (payload.url ? '<br><span style="color:var(--brand-dark);">' + escapeHtml(payload.url) + '</span>' : "");
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function showAuthStage() {
    $("loading").style.display = "none";
    $("actionStage").style.display = "none";
    $("authStage").style.display = "";
    $("headline").textContent = "Sign in to continue";
    $("subline").textContent = "Sign in with your JustGo username and password to save this page.";
    $("footer").style.display = "";
  }

  function showActionStage() {
    $("loading").style.display = "none";
    $("authStage").style.display = "none";
    $("actionStage").style.display = "";
    $("headline").textContent = "Share this page";
    $("subline").textContent = "Choose where to send it — JustGo Notes or a chat.";
    $("footer").style.display = "";

    // Prefill
    $("noteTitle").value = payload.title || "";
    $("noteBody").value = payload.body || buildDefaultBody();
    $("noteTags").value = buildDefaultTags();
    $("noteSource").value = payload.url || "";

    // Tab preference
    if (payload.action === "chat") switchTab("chat");
    else switchTab("notes");

    renderUserChip();
  }

  function renderUserChip() {
    if (!currentUser) { $("userChip").style.display = "none"; return; }
    var name = currentProfile ? (currentProfile.display_name || currentProfile.username) : "you";
    var username = currentProfile ? currentProfile.username : "user";
    var initial = name.charAt(0).toUpperCase();
    var avStyle = currentProfile && currentProfile.avatar_url
      ? ' style="background-image:url(\'' + currentProfile.avatar_url.replace(/'/g, "%27") + '\');color:transparent;"'
      : "";
    $("userChip").style.display = "flex";
    $("userChip").innerHTML =
      '<div class="av"' + avStyle + '>' + (avStyle ? "" : escapeHtml(initial)) + '</div>' +
      '<div class="uinfo"><strong>' + escapeHtml(name) + '</strong><span>@' + escapeHtml(username) + '</span></div>' +
      '<button class="switch" id="switchUser">Switch</button>';
    $("switchUser").addEventListener("click", function () {
      if (!confirm("Sign out of JustGo?")) return;
      db.auth.signOut();
    });
  }

  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.pane === name);
    });
    document.querySelectorAll(".pane").forEach(function (p) {
      p.classList.toggle("active", p.id === "pane-" + name);
    });
  }
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { switchTab(t.dataset.pane); });
  });

  /* ---- Auth ---- */
  function loadProfile() {
    if (!currentUser) return Promise.resolve();
    return db.from("profiles")
      .select("username, display_name, avatar_url")
      .eq("id", currentUser.id)
      .maybeSingle()
      .then(function (r) { currentProfile = r.data || null; });
  }

  function handleLogin() {
    var user = $("loginUser").value.trim().toLowerCase();
    var pass = $("loginPass").value;
    if (!user || !pass) { setMsg($("authMsg"), "Enter username and password.", "err"); return; }
    var btn = $("loginBtn");
    btn.disabled = true; btn.textContent = "Signing in…";
    db.auth.signInWithPassword({ email: user + "@justgo.local", password: pass })
      .then(function (res) {
        if (res.error) throw res.error;
        setMsg($("authMsg"), "Signed in ✓", "ok");
      })
      .catch(function (err) {
        var m = (err && err.message) || String(err);
        if (m.indexOf("Invalid login credentials") > -1) setMsg($("authMsg"), "Incorrect username or password.", "err");
        else if (m.indexOf("Email not confirmed") > -1) setMsg($("authMsg"), "Account not confirmed. Sign in once at justgo.42web.io first.", "err");
        else setMsg($("authMsg"), m, "err");
        btn.disabled = false; btn.textContent = "🔐 Sign in with JustGo";
      });
  }
  $("loginBtn").addEventListener("click", handleLogin);
  $("loginPass").addEventListener("keydown", function (e) { if (e.key === "Enter") handleLogin(); });

  /* ---- Save to Notes ---- */
  function saveNote() {
    if (!currentUser) return;
    var btn = $("saveNoteBtn");
    var msg = $("notesMsg");
    hideMsg(msg);
    var title = $("noteTitle").value.trim() || payload.title || "Untitled";
    var body = $("noteBody").value;
    var tags = $("noteTags").value.split(",").map(function (t) {
      return t.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-");
    }).filter(Boolean);
    var source = $("noteSource").value.trim() || null;
    var isPublic = $("notePublic").checked;

    btn.disabled = true; btn.textContent = "Saving…";
    db.from("notes").insert({
      owner_id: currentUser.id,
      title: title,
      body: body,
      tags: tags,
      is_public: isPublic,
      source_url: source
    }).then(function (r) {
      if (r.error) {
        setMsg(msg, "Could not save: " + r.error.message, "err");
        btn.disabled = false; btn.textContent = "💾 Save to JustGo Notes";
        return;
      }
      setMsg(msg, "Saved to your JustGo Notes ✓", "ok");
      btn.textContent = "Saved ✓";
    });
  }
  $("saveNoteBtn").addEventListener("click", saveNote);

  /* ---- Send to Chat ---- */
  var chatTarget = null;
  var searchTimer = null;

  function searchUsers() {
    var q = $("chatSearch").value.trim().toLowerCase();
    var box = $("chatResults");
    if (!q || !currentUser) { box.innerHTML = ""; return; }
    db.from("profiles")
      .select("id, username, display_name, avatar_url")
      .neq("id", currentUser.id)
      .or("username.ilike.%" + q + "%,display_name.ilike.%" + q + "%")
      .limit(8)
      .then(function (r) {
        box.innerHTML = "";
        if (!r.data || !r.data.length) {
          box.innerHTML = '<div class="user-empty">No users found</div>';
          return;
        }
        r.data.forEach(function (u) {
          var row = document.createElement("div");
          row.className = "user-row";
          var initial = (u.display_name || u.username).charAt(0).toUpperCase();
          row.innerHTML =
            '<div class="av"' + (u.avatar_url ? ' style="background-image:url(\'' + u.avatar_url.replace(/'/g, "%27") + '\');color:transparent;"' : "") + '>' +
              (u.avatar_url ? "" : escapeHtml(initial)) + '</div>' +
            '<div class="info"><strong>' + escapeHtml(u.display_name || u.username) + '</strong>' +
            '<span>@' + escapeHtml(u.username) + '</span></div>';
          row.addEventListener("click", function () {
            chatTarget = u;
            box.innerHTML = "";
            $("chatSearch").value = "";
            renderSelected();
          });
          box.appendChild(row);
        });
      });
  }
  $("chatSearch").addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(searchUsers, 220);
  });

  function renderSelected() {
    var wrap = $("chatSelected");
    wrap.innerHTML = "";
    var btn = $("sendChatBtn");
    if (!chatTarget) { btn.disabled = true; return; }
    btn.disabled = false;
    var chip = document.createElement("div");
    chip.className = "selected-user";
    chip.innerHTML = '<span>@' + escapeHtml(chatTarget.username) +
      (chatTarget.display_name ? " · " + escapeHtml(chatTarget.display_name) : "") +
      '</span><button class="rm" type="button">×</button>';
    chip.querySelector(".rm").addEventListener("click", function () {
      chatTarget = null;
      renderSelected();
    });
    wrap.appendChild(chip);
  }

  function sendChat() {
    if (!chatTarget || !currentUser) return;
    var btn = $("sendChatBtn");
    var msg = $("chatMsg");
    hideMsg(msg);
    btn.disabled = true; btn.textContent = "Sending…";

    (async function () {
      try {
        var conversation = null;
        var mineRes = await db.from("conversation_participants")
          .select("conversation_id").eq("user_id", currentUser.id);
        if (mineRes.data && mineRes.data.length) {
          var ids = mineRes.data.map(function (r) { return r.conversation_id; });
          var matchRes = await db.from("conversation_participants")
            .select("conversation_id").eq("user_id", chatTarget.id).in("conversation_id", ids);
          if (matchRes.data && matchRes.data.length) {
            for (var i = 0; i < matchRes.data.length; i++) {
              var cRes = await db.from("conversations")
                .select("*").eq("id", matchRes.data[i].conversation_id).maybeSingle();
              if (cRes.data && !cRes.data.is_group) { conversation = cRes.data; break; }
            }
          }
        }
        if (!conversation) {
          var ncRes = await db.from("conversations").insert({
            user_a_id: currentUser.id,
            user_b_id: chatTarget.id,
            created_by: currentUser.id,
            is_group: false
          }).select().single();
          if (ncRes.error) throw ncRes.error;
          conversation = ncRes.data;
          await db.from("conversation_participants").insert({
            conversation_id: conversation.id, user_id: currentUser.id, role: "admin"
          });
          await db.from("conversation_participants").insert({
            conversation_id: conversation.id, user_id: chatTarget.id, role: "member"
          });
        }

        var note = $("chatNote").value.trim();
        var shareText = (payload.title || "") + "\n\n" +
          (payload.source ? payload.source + "\n" : "") +
          (payload.url || "");
        var content = (note ? note + "\n\n" : "") + shareText.trim();

        var mRes = await db.from("messages").insert({
          conversation_id: conversation.id,
          sender_id: currentUser.id,
          content: content
        }).select().single();
        if (mRes.error) throw mRes.error;

        await db.from("conversations").update({
          last_message_preview: "📖 " + (payload.title || "").slice(0, 50),
          last_message_at: new Date().toISOString(),
          last_message_sender_id: currentUser.id
        }).eq("id", conversation.id);

        setMsg(msg, "Sent to @" + chatTarget.username + " ✓", "ok");
        btn.textContent = "Sent ✓";
      } catch (e) {
        console.error(e);
        setMsg(msg, "Could not send: " + (e.message || "unknown"), "err");
        btn.disabled = false;
        btn.textContent = "📤 Send";
      }
    })();
  }
  $("sendChatBtn").addEventListener("click", sendChat);

  /* ---- Boot ---- */
  function boot() {
    if (!window.supabase) {
      $("headline").textContent = "Could not load JustGo";
      $("subline").textContent = "Refresh the page to try again.";
      return;
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    readParams();
    renderPreview();

    db.auth.getSession().then(function (res) {
      if (res.data && res.data.session && res.data.session.user) {
        currentUser = res.data.session.user;
        loadProfile().then(showActionStage);
      } else {
        showAuthStage();
      }
    });

    db.auth.onAuthStateChange(function (evt, session) {
      if (evt === "SIGNED_IN" && session && session.user) {
        currentUser = session.user;
        loadProfile().then(showActionStage);
      } else if (evt === "SIGNED_OUT") {
        currentUser = null; currentProfile = null;
        $("loginUser").value = ""; $("loginPass").value = "";
        $("loginBtn").disabled = false;
        $("loginBtn").textContent = "🔐 Sign in with JustGo";
        showAuthStage();
      }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
